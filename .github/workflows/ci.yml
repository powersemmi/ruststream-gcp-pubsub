name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build and test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. Keep the floor in step with
        # `rust-version` in the workspace manifest.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks before
      # it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      # --no-fail-fast: a failing target must not hide failures in the targets behind it; the log
      # then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc cannot:
      # broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  features:
    name: Each feature alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-hack

      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library. It
      # also rewrites the manifests in place, which is why this job never passes --locked.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with `rust-version` in the
      # workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # No pins are needed today: the google-cloud stack declares fully-qualified floors, so the
      # minimal graph it drags in is already recent enough to build. A third-party manifest whose
      # declared bound turns out to be too loose gets a `cargo update -p X --precise Y` step here,
      # with the reason and the version that fixes it.

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --workspace --all-targets --all-features
          cargo test --workspace --all-features --no-fail-fast

  broker-integration:
    name: Broker integration (Pub/Sub emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub \
            -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=ruststream-test

      - name: Wait for the emulator
        timeout-minutes: 2
        run: |
          timeout 90 bash -c 'until docker logs pubsub 2>&1 | grep -q "Server started"; do sleep 1; done'
          docker logs pubsub | tail -5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against the emulator
        env:
          PUBSUB_TEST_HOST: 127.0.0.1:8085
        run: >-
          cargo test -p ruststream-gcp-pubsub --all-features
          --test integration_pubsub
          --test conformance_pubsub
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f pubsub

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
