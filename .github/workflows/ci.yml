name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-gcp-pubsub

      # The workspace resolves `ruststream` through a sibling path until 0.6.0 is published on
      # crates.io (the same bootstrap ruststream-nats used before 0.5).
      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      # The MSRV leg follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve toolchain
        id: toolchain
        working-directory: ruststream-gcp-pubsub
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
            test -n "$TOOLCHAIN"
          fi
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-gcp-pubsub

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-gcp-pubsub
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        working-directory: ruststream-gcp-pubsub
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        working-directory: ruststream-gcp-pubsub
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        working-directory: ruststream-gcp-pubsub
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (handler-stub only, no live broker)
        working-directory: ruststream-gcp-pubsub
        run: cargo test --workspace --all-features

  broker-integration:
    name: Broker integration (Pub/Sub emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-gcp-pubsub

      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub \
            -p 127.0.0.1:8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=ruststream-test

      - name: Wait for the emulator
        timeout-minutes: 2
        run: |
          timeout 90 bash -c 'until docker logs pubsub 2>&1 | grep -q "Server started"; do sleep 1; done'
          docker logs pubsub | tail -5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ruststream-gcp-pubsub

      - name: Run integration + conformance against the emulator
        working-directory: ruststream-gcp-pubsub
        env:
          PUBSUB_TEST_HOST: 127.0.0.1:8085
        run: >-
          cargo test -p ruststream-gcp-pubsub --all-features
          --test integration_pubsub
          --test conformance_pubsub
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f pubsub

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: ruststream-gcp-pubsub

      # cargo-deny resolves the whole dependency graph, so the cross-repo `ruststream`
      # path dependency must be present.
      - uses: actions/checkout@v4
        with:
          repository: powersemmi/ruststream
          persist-credentials: false
          path: ruststream

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        working-directory: ruststream-gcp-pubsub
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: codespell
        working-directory: ruststream-gcp-pubsub
        run: uvx codespell

      - name: zizmor
        working-directory: ruststream-gcp-pubsub
        run: uvx zizmor .github/workflows
