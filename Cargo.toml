[workspace]
resolver = "3"
members = ["crates/ruststream-gcp-pubsub"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# google-cloud-pubsub tracks a 1.88 floor; the core stays at 1.85 (a dependent may exceed
# its dependency's floor).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-gcp-pubsub"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-gcp-pubsub = { path = "crates/ruststream-gcp-pubsub" }

# The floor names the release candidate on purpose: a range that names no pre-release excludes
# every pre-release, so `>=0.7.0` would not resolve against `0.7.0-rc.1`. The final `0.7.0`
# satisfies this bound too, so the requirement carries over the release unchanged.
ruststream = { version = ">=0.7.0-rc.1, <0.8.0", default-features = false }

google-cloud-pubsub = "1.3"
# The floor the client itself demands: google-cloud-pubsub 1.3 depends on auth 1.15, so a wider
# bound here claims support for versions that can never resolve beside it.
google-cloud-auth = "1.15"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
