[workspace]
resolver = "3"
members = ["crates/ruststream-gcp-pubsub"]

[workspace.package]
version = "0.6.0"
edition = "2024"
# google-cloud-pubsub tracks a 1.88 floor; the core stays at 1.85 (a dependent may exceed
# its dependency's floor).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-gcp-pubsub"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-gcp-pubsub = { path = "crates/ruststream-gcp-pubsub" }

# The path component rides the sibling checkout until ruststream 0.6.0 is published on
# crates.io (the same bootstrap ruststream-nats used before 0.5); the version range is what
# a packaged release resolves against.
ruststream = { version = ">=0.6.0, <0.7.0", path = "../ruststream", default-features = false }

google-cloud-pubsub = "1.3"
google-cloud-auth = "1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
