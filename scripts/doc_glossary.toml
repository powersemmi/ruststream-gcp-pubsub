[[term]]
en = "zero-cost"
ru = "zero-cost"
zh = "零成本"

[[term]]
en = "trait"
en_match = "traits?"
ru = "трейт"
ru_match = "трейт"
zh = "trait"

[[term]]
en = "crate"
en_match = "crates?"
ru = "крейт"
ru_match = "крейт"
zh = "crate"

[[term]]
