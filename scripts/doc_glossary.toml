ru = "typestate"
zh = "typestate"

# Pub/Sub's own vocabulary. The rendering is the one Google's documentation writes in that
# language, because a reader arrives here from it and has to recognise the same service.

[[term]]
en = "topic"
en_match = "topics?"
ru = "тема"
ru_match = "\\bтем[аыуеой]"
zh = "主题"

[[term]]
en = "ordering key"
en_match = "ordering\\s+keys?"
ru = "ключ упорядочивания"
ru_match = "ключ\\w*\\s+упорядочивания"
zh = "排序键"

[[term]]
en = "streaming pull"
en_match = "streaming[-\\s]pull"
ru = "streaming pull"
ru_match = "streaming[-\\s]pull"
zh = "流式拉取"

[[term]]
