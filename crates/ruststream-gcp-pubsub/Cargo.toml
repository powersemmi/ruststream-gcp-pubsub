[package]
name = "ruststream-gcp-pubsub"
description = "Google Cloud Pub/Sub broker implementation for the RustStream messaging framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["gcp", "pubsub", "google-cloud", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The in-process test broker (TestableBroker + TestApp support). The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]

[dependencies]
ruststream = { workspace = true, default-features = false }
google-cloud-pubsub.workspace = true
google-cloud-auth.workspace = true
bytes.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `cbor` is a second codec and nothing else: a test that names it proves a publish carries the
# codec its mount site chose rather than the crate default, which json alone cannot tell apart.
ruststream = { workspace = true, features = [
    "conformance",
    "testing",
    "macros",
    "json",
    "cbor",
] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
